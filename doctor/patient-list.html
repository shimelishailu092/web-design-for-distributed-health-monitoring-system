<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient List</title>

<link rel="stylesheet" href="../assets/css/admin-style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Optional: simple table search styling */
.search-box {
    margin-bottom: 15px;
    padding: 8px;
    width: 100%;
    max-width: 300px;
    border-radius: 4px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
    <h1><i class="fas fa-users"></i> Patient List</h1>
</header>

<nav>
    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="patient-list.html" class="active"><i class="fas fa-users"></i> Patients</a>
    <a href="reports.html"><i class="fas fa-file-medical"></i> Reports</a>
    <a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>

<div class="dashboard">
    <h2>All Patients</h2>

    <!-- Search Box -->
    <input type="text" placeholder="Search patient..." class="search-box" id="searchBox">

    <table id="patientsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Age</th>
                <th>Condition</th>
                <th>Status</th>
                <th>View</th>
            </tr>
        </thead>
        <tbody>
            <!-- JS will populate -->
        </tbody>
    </table>
</div>

<footer>
    <p>&copy; 2025 Health System. All Rights Reserved.</p>
</footer>

<script>
// Fetch patients dynamically
fetch("../api/doctor/get-all-patients.php")
    .then(res => res.json())
    .then(data => {
        const tbody = document.querySelector("#patientsTable tbody");
        tbody.innerHTML = "";
        data.forEach(p => {
            let statusClass = p.status.toLowerCase() === "critical" ? "badge-warning" : "badge-success";
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.full_name}</td>
                    <td>${p.age}</td>
                    <td>${p.condition}</td>
                    <td><span class="badge ${statusClass}">${p.status}</span></td>
                    <td>
                        <a href="patient-details.html?id=${p.id}" class="btn-view">
                            <i class="fas fa-eye"></i> View
                        </a>
                    </td>
                </tr>
            `;
        });
    })
    .catch(err => console.error(err));

// Optional: simple client-side search
const searchBox = document.getElementById("searchBox");
searchBox.addEventListener("input", function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll("#patientsTable tbody tr");
    rows.forEach(row => {
        const name = row.cells[1].textContent.toLowerCase();
        row.style.display = name.includes(filter) ? "" : "none";
    });
});
</script>

</body>
</html>
