<h2>System Health & Status</h2>

<ul id="statusList"></ul>

<script>
fetch("../api/admin/get-system-status.php")
    .then(res => res.json())
    .then(s => {
        const ul = document.getElementById("statusList");

        ul.innerHTML = `
            <li><b>Server Status:</b> ${s.server_status}</li>
            <li><b>Server Time:</b> ${s.server_time}</li>
            <li><b>PHP Version:</b> ${s.php_version}</li>
            <li><b>Server Software:</b> ${s.server_software}</li>
            <li><b>Uptime:</b> ${s.uptime}</li>
        `;
    });
</script>
