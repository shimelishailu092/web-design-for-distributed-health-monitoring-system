<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* Body */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

/* Container */
.container {
    background: #fff;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 400px;
    text-align: center;
    transition: transform 0.3s;
}
.container:hover {
    transform: translateY(-5px);
}

/* Heading */
.container h2 {
    margin-bottom: 25px;
    color: #333;
    font-weight: 600;
}

/* Labels */
label {
    display: block;
    text-align: left;
    margin-bottom: 5px;
    color: #555;
    font-weight: 500;
}

/* Inputs */
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    transition: all 0.3s;
}
input[type="email"]:focus,
input[type="password"]:focus {
    border-color: #4facfe;
    box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
    outline: none;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #4facfe;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
button:hover {
    background: #00f2fe;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Paragraph */
p {
    margin-top: 15px;
    color: #555;
}
p a {
    color: #4facfe;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
}
p a:hover {
    color: #00f2fe;
}

/* Responsive */
@media (max-width: 500px) {
    .container {
        padding: 30px 20px;
    }
}
</style>

</head>
<body>

<div class="container">
    <h2>User Login</h2>

    <form action="login.php" method="POST">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <p>Don’t have an account? <a href="../../patient/register.html">please first register</a></p>

</div>

</body>
</html>
