<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts | Health Monitor</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: #f5f5f5;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2c3e50;
    color: #fff;
    padding: 10px 20px;
}

.nav-links a {
    color: #fff;
    margin-right: 15px;
    text-decoration: none;
}

.nav-links a.active {
    font-weight: bold;
    text-decoration: underline;
}

.container {
    padding: 20px;
    max-width: 800px;
    margin: auto;
}

.alert-card {
    background: #fff;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    border-left: 5px solid #3498db;
}

.alert-card.unread {
    background: #fff3cd;
    border-left-color: #f39c12;
}

.alert-btn {
    margin-top: 10px;
    background: #2ecc71;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    color: #fff;
    cursor: pointer;
}

.mark-all-btn {
    background: #3498db;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    margin-bottom: 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">
    <i class="fas fa-heartbeat"></i>
    <strong>Health Monitor</strong>
  </div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="health-history.html"><i class="fas fa-history"></i> History</a>
    <a href="appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
    <a href="reports.html">Reports</a>
    <a href="manual_vitals.html"><i class="fas fa-file-medical"></i> Vitals</a>
    <a class="active">Alerts</a>
    <a href="profile.html">Profile</a>
    <a href="../index.html">Logout</a>
  </div>
</div>

<div class="container">
  <h1>My Alerts</h1>

  <button class="mark-all-btn" onclick="markAllRead()">
    <i class="fas fa-check-double"></i> Mark All as Read
  </button>

  <div id="alerts-list"></div>
</div>

<script src="../assets/js/alerts.js"></script>
</body>
</html>
