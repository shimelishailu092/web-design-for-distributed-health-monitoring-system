<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Heart Rate</title>
</head>
<body>
    <h1>Submit Heart Rate</h1>
    <form id="heartRateForm">
        <label>Patient ID: <input type="number" name="patient_id" required></label><br><br>
        <label>Heart Rate: <input type="number" name="heart_rate" required></label><br><br>
        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>

    <script>
        const form = document.getElementById('heartRateForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('../api/patient/submit_vitals.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                message.innerText = result.success ? "Heart rate submitted!" : "Error: " + result.error;
                if (result.success) form.reset();
            } catch (err) {
                message.innerText = "Error submitting heart rate.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
