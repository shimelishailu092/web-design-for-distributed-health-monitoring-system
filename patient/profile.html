<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Health Monitor</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: #f5f5f5;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2c3e50;
    color: #fff;
    padding: 10px 20px;
}

.nav-links a {
    color: #fff;
    margin-right: 15px;
    text-decoration: none;
}

.nav-links a.active {
    font-weight: bold;
    text-decoration: underline;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.card {
    background: #fff;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.1);
}

.card label {
    display: block;
    margin-top: 10px;
}

.card input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}

.card button {
    margin-top: 15px;
    background: #3498db;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo"><i class="fas fa-heartbeat"></i><h2>Health Monitor</h2></div>
  <div class="nav-links">
    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="health-history.html"><i class="fas fa-history"></i> History</a>
    <a href="appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
    <a href="reports.html"><i class="fas fa-file-medical"></i> Reports</a>
    <a href="manual_vitals.html"><i class="fas fa-file-medical"></i> Vitals</a>
    <a href="alerts.html"><i class="fas fa-user"></i> Alerts</a>
    <a class="active"><i class="fas fa-user"></i> Profile</a>
    <a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<div class="container">

  <h1>My Profile</h1>

  <!-- PROFILE INFO -->
  <div class="card">
    <h3>Personal Information</h3>

    <label>Full Name</label>
    <input type="text" id="full_name">

    <label>Email</label>
    <input type="email" id="email">

    <label>Phone</label>
    <input type="text" id="phone">

    <button onclick="updateProfile()">Save Changes</button>
  </div>

  <!-- CHANGE PASSWORD -->
  <div class="card">
    <h3>Change Password</h3>

    <label>Current Password</label>
    <input type="password" id="current_password">

    <label>New Password</label>
    <input type="password" id="new_password">

    <label>Confirm New Password</label>
    <input type="password" id="confirm_password">

    <button onclick="changePassword()">Change Password</button>
  </div>

</div>

<script src="../assets/js/profile.js"></script>
</body>
</html>
