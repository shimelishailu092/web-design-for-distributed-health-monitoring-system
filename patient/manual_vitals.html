<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manual Vitals Entry</title>
    <link rel="stylesheet" href="../assets/css/health-history.css">
    <style>
        body { font-family: Arial; background: #f4f6f8; }
        form {
            width: 350px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 16px;
        }
        button {
            background: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="navbar">
  <h2><i class="fas fa-heartbeat"></i> Health Monitor</h2>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="health-history.html">History</a>
    <a href="appointments.html">Appointments</a>
    <a href="reports.html"><i class="fas fa-file-medical"></i> Reports</a>
    <a class="active">Vitals</a>
    <a href="alerts.html"><i class="fas fa-user"></i> Alerts</a>
    <a href="profile.html">Profile</a>
    <a href="../index.html">Logout</a>
  </div>
</div>

<form id="vitalsForm">
    <h3 style="text-align:center;">Enter Your Vital Signs</h3>

    <input type="number" name="heart_rate" placeholder="Heart Rate (bpm)" required>
    <input type="number" name="systolic" placeholder="Systolic BP" required>
    <input type="number" name="diastolic" placeholder="Diastolic BP" required>
    <input type="number" step="0.1" name="temperature" placeholder="Temperature (°C)" required>
    <input type="number" name="glucose" placeholder="Glucose (mg/dL)" required>

    <button type="submit">Submit Vitals</button>
    <p id="msg"></p>
</form>

<script src="../assets/js/vitals.js"></script>
</body>
</html>
